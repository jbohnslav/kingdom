name: Release on Version Bump

on:
  push:
    branches: [master]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish after a missed automatic release
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release_notes: ${{ steps.release.outputs.release_notes }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/master" ]; then
            echo "Release workflow must run from refs/heads/master, not $RELEASE_REF." >&2
            exit 1
          fi
          project_version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$EVENT_NAME" = "push" ]; then
            if git show "${BEFORE_SHA}:pyproject.toml" > /tmp/previous-pyproject.toml 2>/dev/null; then
              previous_version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('/tmp/previous-pyproject.toml').read_text())['project']['version'])")
            else
              previous_version=""
            fi
            if [ "$previous_version" = "$project_version" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged; skipping release."
              exit 0
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_VERSION" != "$project_version" ]; then
              echo "Requested version $REQUESTED_VERSION does not match pyproject.toml version $project_version." >&2
              exit 1
            fi
          else
            echo "Unsupported release event: $EVENT_NAME" >&2
            exit 1
          fi
          release_notes="docs/releases/${project_version}.md"
          if ! git ls-files --error-unmatch "$release_notes" > /dev/null; then
            echo "Checked-in release notes not found: $release_notes" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "release_notes=$release_notes" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@04224aa8caab79e9c08d41c1ef06d6394aafe6a0 # v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

      - name: Validate documented CLI workflow
        run: bash scripts/smoke.sh

      - name: Build
        run: |
          rm -rf dist/
          uv build

      - name: Validate artifacts
        run: uv run --with twine python -m twine check dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          release_notes="${{ needs.prepare.outputs.release_notes }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$release_notes"
            gh release upload "$tag" dist/*.tar.gz dist/*.whl --clobber
          else
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --notes-file "$release_notes" \
              dist/*.tar.gz dist/*.whl
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
