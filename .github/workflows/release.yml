name: Release on Version Bump

on:
  push:
    branches: [master]
    paths: [pyproject.toml]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4
        with:
          fetch-depth: 0

      - name: Check for version change
        id: v
        shell: bash
        run: |
          new=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          if git show HEAD^:pyproject.toml > /tmp/prev.toml 2>/dev/null; then
            old=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('/tmp/prev.toml').read_text())['project']['version'])
          ")
          else
            old=""
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if version unchanged
        if: steps.v.outputs.changed != 'true'
        run: echo "Version unchanged; skipping release."

      - name: Set up uv
        if: steps.v.outputs.changed == 'true'
        uses: astral-sh/setup-uv@04224aa8caab79e9c08d41c1ef06d6394aafe6a0 # v5

      - name: Build
        if: steps.v.outputs.changed == 'true'
        run: |
          rm -rf dist/
          uv build

      - name: Create GitHub Release
        if: steps.v.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.v.outputs.new }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.whl --clobber
          else
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --generate-notes \
              dist/*.tar.gz dist/*.whl
          fi

      - name: Publish to PyPI
        if: steps.v.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
